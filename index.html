<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Website</title>
    <style>
        body {
            background-color: violet;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            margin-top: 50px;
            animation: fadeIn 2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        /* Loader Style */
        #loader {
            border: 16px solid #f3f3f3;
            border-top: 16px solid violet;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 2s linear infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            margin: -30px 0 0 -30px;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loader"></div>
    <script>
        // Show loader
        document.getElementById('loader').style.display = 'block';

        // Check password
        const password = prompt("Enter password to access the site:");
        if (password !== 'KASHISH') {
            alert('Incorrect password!');
            window.location.href = "about:blank";
        } else {
            document.getElementById('loader').style.display = 'none';
            document.body.innerHTML = `<h1>Happy Birthday, Sonam!</h1>\n<p>Congratulations on your special day!</p>\n<p>From Kuber</p>\n<p>💖 Marriage Proposal 💖</p>\n<p>Keep smiling my sunshine, do what u wish, don't care anyone anymore.</p>`;
        }
    </script>
</body>
</html>
